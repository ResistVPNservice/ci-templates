# Общий CI/CD микросервиса. Сервис подключает его так (.github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: ResistVPNservice/ci-templates/.github/workflows/python-service.yml@v1
#       with: { image: tg-user-service }
#       secrets: inherit
#       permissions: { contents: read, packages: write }
#
# PR:               линтер → тесты → поиск утёкших секретов → пробная сборка образа
# push в main:      + образ в GHCR (sha-<коммит>, main) → скан уязвимостей → новая версия в deploy/envs/staging
# тег vX.Y.Z:       + образ с тегом X.Y.Z (его потом выкатывают в prod через PR в deploy)

name: python-service

on:
  workflow_call:
    inputs:
      image:
        description: Имя образа и сервиса в k8s, например tg-user-service
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.12"
      deploy-repo:
        required: false
        type: string
        default: ResistVPNservice/deploy
    secrets:
      DEPLOY_TOKEN:
        description: Токен с правом записи в репозиторий deploy (автовыкатка на staging)
        required: false

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks — не закоммичены ли токены и пароли
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v

  build:
    needs: [lint-test, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image }}" >> "$GITHUB_OUTPUT"
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — уязвимости в образе
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  bump-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Новая версия в deploy/envs/staging → Argo CD выкатит её сам
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          FILE: envs/staging/${{ inputs.image }}.yaml
        run: |
          if [ -z "$TOKEN" ]; then echo "DEPLOY_TOKEN не задан — автовыкатка на staging пропущена"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ inputs.deploy-repo }}.git" deploy
          cd deploy
          sed -i -E "s/^(\s*tag:\s*).*/\1${TAG}/" "$FILE"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "chore: ${{ inputs.image }} ${TAG} на staging" || { echo "версия не изменилась"; exit 0; }
          git push
