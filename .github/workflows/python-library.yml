# Общий CI библиотеки (contracts, service-kit, tg_kit):
#   PR и push:  линтер → тесты → (для contracts) проверка обратной совместимости событий → поиск секретов
#   тег vX.Y.Z: + GitHub Release — по этому тегу сервисы подключают библиотеку из git

name: python-library

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.12"
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Доступ к приватным библиотекам организации
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        if: env.TOKEN != ''
        run: |
          # PowerShell мог дописать к секрету BOM и CRLF — оставляем только допустимые символы токена GitHub
          TOKEN=$(printf '%s' "$TOKEN" | tr -cd 'A-Za-z0-9_')
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Обратная совместимость контрактов
        if: hashFiles('quantum_contracts/schema.py') != ''
        run: python -m quantum_contracts.schema check

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v

  release:
    needs: [lint-test, secrets-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
